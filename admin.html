<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة سين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1A15">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=202611262047">
<style>
body{background:#F3EFE7}
.bar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
.bar .wrap{display:flex;align-items:center;gap:14px;height:64px;max-width:1400px}
.bar .logo b{color:#fff}
.bar .who{margin-inline-start:auto;font-size:13px;color:#AEB7B2;display:flex;gap:10px;align-items:center}
.bar .btn-ghost{color:#fff;border-color:#33413A}
.wrap.w{max-width:1400px}
.login{max-width:420px;width:calc(100% - 32px);margin:10vh auto;padding:32px}
.login h1{font-size:26px;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stat small{color:var(--muted);font-size:13px;display:block}
.stat b{font-family:var(--f-head);font-size:28px;line-height:1.3}
.stat em{font-style:normal;font-size:13px;color:var(--muted)}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs .n{background:var(--gold);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;margin-inline-start:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .inp{max-width:280px;padding:10px 14px;border-radius:999px}
.tools .sp{flex:1}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:12px 14px;background:#FAF8F3;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:#FBF9F4}
.tbl code{font-size:12.5px;background:var(--bg2);padding:2px 7px;border-radius:7px}
.pill{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}
.late{color:var(--err);font-weight:700}
@media (max-width:820px){.tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}.tbl tr{border-bottom:1px solid var(--line);padding:10px 4px}.tbl td{border:0;padding:3px 12px}.tbl td.hm{display:none}}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(15,26,21,.45);display:flex;justify-content:flex-start}
.drawer .in{width:min(560px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px;box-shadow:var(--shadow-lg);animation:sl .3s var(--ease)}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.drawer h2{font-size:22px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:14px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;word-break:break-word}
.det{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;font-size:14.5px}
.flist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.flist a{font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect{font-family:var(--f-head);font-size:15px;margin:22px 0 8px}
.wa-row{display:flex;gap:8px;flex-wrap:wrap}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.empty{text-align:center;color:var(--muted);padding:40px}
.alert{background:#FEF3F2;border:1px solid #FECDCA;color:var(--err);border-radius:14px;padding:12px 16px;font-size:14px;margin-top:12px}
.cp-form{display:grid;grid-template-columns:1.3fr .7fr .9fr .7fr auto;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.cp-form .field{margin:0}
@media (max-width:820px){.cp-form{grid-template-columns:1fr 1fr}.cp-form .wide{grid-column:1/-1}}
.tbl.cp tbody tr{cursor:default}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.al{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:14px;padding:11px 16px;font-size:14px;border:1px solid}
.al.r{background:#FEF3F2;border-color:#FECDCA;color:#B42318}.al.y{background:#FFF8E6;border-color:#F3DFA8;color:#8a6a22}.al.g{background:#E3F1EA;border-color:#B7DCC8;color:var(--ok)}
.al button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;margin-inline-start:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.box h3{font-size:16px;margin:0 0 12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bars div{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bars i{display:block;height:10px;border-radius:99px;background:var(--brand);min-width:3px}
.bars em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.links a{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--gold)}
.links b{font-size:15px}.links small{color:var(--muted);font-size:12.5px}
@media (max-width:640px){.bar .who span{display:none}.bar .logo b{font-size:16px}.bar .logo img{width:30px;height:30px}.bell{padding:6px 10px}.bell .t{display:none!important}.bar .btn-sm{padding:7px 12px;font-size:13px}.bar .who{gap:6px}.bar .wrap{gap:8px}.tabs{white-space:nowrap;scrollbar-width:none}.tabs button{padding:12px 10px;flex:none}.tools .inp{max-width:none;flex:1 1 100%}.drawer .in{padding:16px}.kv{grid-template-columns:96px 1fr}}
.rep{display:inline-block;font-size:11px;font-weight:700;background:var(--gold-soft);color:#8a6a22;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.dl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
.dl a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.dl button{all:unset;cursor:pointer;color:var(--err);font-weight:700;padding:0 4px}
.hist a{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;color:var(--ink);text-decoration:none}
.bell{background:none;border:1px solid #33413A;color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.steps{display:flex;gap:4px;margin:10px 0 4px}.steps span{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps span.on{background:var(--brand)}
pre.sql{background:var(--ink);color:#E2C27E;padding:12px;border-radius:12px;direction:ltr;text-align:left;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="assets/config.js?v=202611262047"></script>
<script src="assets/catalog.js?v=202611262047"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(async()=>{
const S=window.SEEN, C=window.SEEN_CONFIG, app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);};
const d=x=>x?new Date(x).toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'short'}):'';
const dt=x=>x?new Date(x).toLocaleString('ar-SA-u-ca-gregory',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
const pubUrl=p=>`${C.SUPABASE_URL}/storage/v1/object/public/deliveries/${p.split('/').map(encodeURIComponent).join('/')}`;
const pill=s=>{const v=S.STATUS[s]||['?','?','#999'];return `<span class="pill" style="background:${v[2]}">${v[0]}</span>`;};

if(!S.dbReady()){ app.innerHTML=`<div class="card login"><h1>اللوحة غير مفعّلة</h1><p>حط رابط Supabase والمفتاح العام في ملف <code>assets/config.js</code> وبعدها ارجع هنا. الخطوات كاملة في ملف <code>SETUP.md</code>.</p></div>`; return; }
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);

function loginView(msg){
  app.innerHTML=`<form class="card login" id="lf"><a class="logo" href="index.html" style="margin-bottom:18px"><img src="logo.png" alt="" width="40" height="40"><b>سين</b></a>
  <h1>لوحة الطلبات</h1><p>سجّل دخولك بحساب المسؤول</p>
  <div class="field"><label for="em">الإيميل</label><input class="inp" id="em" type="email" dir="ltr" autocomplete="username" required></div>
  <div class="field"><label for="pw">كلمة المرور</label><input class="inp" id="pw" type="password" dir="ltr" autocomplete="current-password" required></div>
  <button class="btn btn-primary" style="width:100%">دخول</button>${msg?`<div class="alert">${msg}</div>`:''}</form>`;
  document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
    if(error){b.disabled=false;loginView('الإيميل أو كلمة المرور غير صحيحة');} else boot();});
}

let ORD=[], REV=[], CPN=[], cq='', tab='orders', fStatus='open', q='', user=null;
async function boot(){
  const {data:{session}}=await sb.auth.getSession(); if(!session) return loginView();
  user=session.user;
  const {data:isAdmin}=await sb.rpc('is_admin');
  if(!isAdmin){ app.innerHTML=`<div class="card login"><h1>حسابك مو مسؤول</h1><p>أضف إيميلك لجدول المسؤولين من Supabase > SQL Editor:</p><pre class="sql">insert into public.admins (email) values ('${esc(user.email)}');</pre><button class="btn btn-ghost" id="lo">خروج</button></div>`; document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();loginView();}; return; }
  shell(); await load();
  setInterval(()=>{ if(!document.getElementById('dw')) load(); },60000);
}
function shell(){
  app.innerHTML=`<header class="bar"><div class="wrap w"><a class="logo" href="index.html" target="_blank"><img src="logo.png" alt="" width="36" height="36"><b>لوحة سين</b></a>
    <div class="who"><span dir="ltr">${esc(user.email)}</span><button class="bell" id="bell" hidden title="فعّل التنبيهات">🔔<span class="t"> فعّل التنبيهات</span></button><button class="btn btn-ghost btn-sm" id="rf">تحديث</button><button class="btn btn-ghost btn-sm" id="lo">خروج</button></div></div></header>
  <main class="wrap w" style="padding-bottom:60px"><div class="stats" id="stats"></div>
  <div class="tabs" style="overflow-x:auto"><button data-t="orders" class="on">الطلبات <span class="n" id="newN" hidden></span></button><button data-t="customers">العملاء</button><button data-t="stats">الإحصائيات</button><button data-t="reviews">التقييمات <span class="n" id="rvN" hidden></span></button><button data-t="coupons">أكواد الخصم</button><button data-t="links">روابط الموقع</button></div><div id="body"></div></main><div id="dr"></div>`;
  document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();loginView();};
  document.getElementById('rf').onclick=()=>load().then(()=>toast('تم التحديث'));
  const bell=document.getElementById('bell');
  if('Notification' in window && Notification.permission!=='granted'){ bell.hidden=false; bell.onclick=async()=>{ const r=await Notification.requestPermission(); if(r==='granted'){bell.hidden=true; toast('تمام، بيوصلك تنبيه مع كل طلب جديد');} else toast('التنبيهات مقفلة من المتصفح'); }; }
  document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render();};
}
function ding(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [880,1320].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15,a.currentTime+i*.18); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.18+.3); o.start(a.currentTime+i*.18); o.stop(a.currentTime+i*.18+.3);}); }catch(e){} }
const visits=ph=>ORD.filter(x=>x.phone===ph).length;
const normPhone=v=>{let d=String(v||'').replace(/\D/g,''); if(/^05\d{8}$/.test(d)) d='966'+d.slice(1); else if(/^5\d{8}$/.test(d)) d='966'+d; return d;};
const reviewed=code=>REV.some(r=>r.order_code===code);
const deliveredAt=o=>new Date(o.delivered_at||o.updated_at||o.created_at).getTime();
const noReview=()=>ORD.filter(o=>o.status==='delivered'&&!reviewed(o.code)&&Date.now()-deliveredAt(o)>2*864e5);
async function load(){
  const [o,r,cp]=await Promise.all([sb.from('orders').select('*').order('created_at',{ascending:false}).limit(1000), sb.from('reviews').select('*').order('created_at',{ascending:false}), sb.from('coupons').select('*').order('created_at',{ascending:false})]);
  if(o.error){ document.getElementById('body').innerHTML=`<div class="alert">${esc(o.error.message)}</div>`; return; }
  const before=new Set(ORD.map(x=>x.id)), fresh=ORD.length?(o.data||[]).filter(x=>!before.has(x.id)):[];
  ORD=o.data||[]; REV=r.data||[]; CPN=cp.data||[];
  if(fresh.length){ const msg=`وصل ${fresh.length===1?'طلب جديد':fresh.length+' طلبات جديدة'} 🔔`; toast(msg); ding();
    try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
    try{ if('Notification' in window&&Notification.permission==='granted') fresh.forEach(o=>{ const n=new Notification('طلب جديد في سين',{body:`${o.code} · ${o.service_name}\n${o.customer_name}`,icon:'logo.png',tag:o.code}); n.onclick=()=>{window.focus();openOrder(o.id);}; }); }catch(e){} }
  const nn=ORD.filter(x=>x.status==='new').length, ne=document.getElementById('newN'); if(ne){ne.hidden=!nn; ne.textContent=nn;} document.title=nn?`(${nn}) لوحة سين`:'لوحة سين'; stats(); render();
}
function stats(){
  const now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1);
  const month=ORD.filter(o=>new Date(o.created_at)>=m0&&o.status!=='cancelled');
  const c=s=>ORD.filter(o=>o.status===s).length;
  const income=month.reduce((a,o)=>a+(+o.paid||0),0);
  const due=ORD.filter(o=>o.status!=='cancelled'&&o.price).reduce((a,o)=>a+Math.max(0,(+o.price)-(+o.paid||0)),0);
  document.getElementById('stats').innerHTML=[
    ['طلبات جديدة',c('new'),'تحتاج رد'],['قيد العمل',c('paid')+c('in_progress')+c('review'),'مدفوعة أو قيد التنفيذ'],
    ['طلبات الشهر',month.length,`${month.filter(o=>o.status==='delivered').length} تم تسليمها`],['دخل الشهر',income.toLocaleString('ar-SA'),'ر.س مدفوعة'],['متبقي للتحصيل',due.toLocaleString('ar-SA'),'ر.س']
  ].map(([a,b,c])=>`<div class="stat"><small>${a}</small><b>${b}</b><em>${c}</em></div>`).join('');
  const wk=Date.now()-7*864e5, pend=REV.filter(r=>new Date(r.created_at).getTime()>wk).length, n=document.getElementById('rvN'); n.hidden=!pend; n.textContent=pend; n.title='تقييمات آخر 7 أيام';
}
function render(){ ({orders:renderOrders,customers:renderCustomers,stats:renderStats,coupons:renderCoupons,links:renderLinks,reviews:renderReviews})[tab](); }
function renderStats(){
  const now=new Date(), d30=Date.now()-30*864e5, ok=o=>o.status!=='cancelled';
  const last=ORD.filter(o=>new Date(o.created_at).getTime()>d30);
  const bars=(rows,unit='')=>{const mx=Math.max(1,...rows.map(r=>r[1])); return rows.length?`<div class="bars">${rows.map(([n,v,x])=>`<div><span>${esc(n)}</span><i style="width:${Math.round(v/mx*100)}%"></i><em>${v.toLocaleString('ar-SA')}${unit}${x?` · ${x}`:''}</em></div>`).join('')}</div>`:'<p style="color:var(--muted);margin:0">ما فيه بيانات للحين</p>';};
  const group=(list,key)=>{const m={}; list.forEach(o=>{const k=key(o)||'غير محدد'; m[k]=(m[k]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const svc={}; ORD.filter(ok).forEach(o=>{(Array.isArray(o.items)&&o.items.length?o.items:[{name:o.service_name}]).forEach(x=>{const k=x.name||'؟'; svc[k]=svc[k]||[0,0]; svc[k][0]++;}); });
  const months=[...Array(6)].map((_,i)=>{const a=new Date(now.getFullYear(),now.getMonth()-5+i,1), b=new Date(now.getFullYear(),now.getMonth()-4+i,1);
    const l=ORD.filter(o=>ok(o)&&new Date(o.created_at)>=a&&new Date(o.created_at)<b); return [a.toLocaleDateString('ar-SA-u-ca-gregory',{month:'long'}), l.reduce((s,o)=>s+(+o.paid||0),0), `${l.length} طلب`];});
  const total=ORD.length, paid=ORD.filter(o=>['paid','in_progress','review','delivered'].includes(o.status)).length;
  const avg=REV.length?(REV.reduce((s,r)=>s+r.rating,0)/REV.length).toFixed(1):'—';
  const cpn=CPN.filter(c=>c.uses).map(c=>[c.code,c.uses,`${c.percent}%`]);
  document.getElementById('body').innerHTML=`<div class="stats" style="margin-top:0">
      <div class="stat"><small>كل الطلبات</small><b>${total}</b><em>منها ${paid} دفعت</em></div>
      <div class="stat"><small>نسبة اللي يدفعون</small><b>${total?Math.round(paid/total*100):0}%</b><em>من الطلبات اللي توصل</em></div>
      <div class="stat"><small>طلبات آخر 30 يوم</small><b>${last.length}</b><em>${last.filter(o=>o.status==='delivered').length} تسلمت</em></div>
      <div class="stat"><small>متوسط التقييم</small><b>${avg}</b><em>${REV.length} تقييم</em></div>
      <div class="stat"><small>متوسط قيمة الطلب</small><b>${(()=>{const l=ORD.filter(o=>o.price);return l.length?Math.round(l.reduce((s,o)=>s+(+o.price),0)/l.length):'—';})()}</b><em>ر.س</em></div></div>
    <div class="grid2">
      <div class="box"><h3>الدخل آخر 6 شهور (المدفوع)</h3>${bars(months,' ر.س')}</div>
      <div class="box"><h3>من وين يجون العملاء</h3>${bars(group(ORD,o=>o.source))}</div>
      <div class="box"><h3>أكثر الخدمات طلبًا</h3>${bars(Object.entries(svc).map(([k,v])=>[k,v[0]]).sort((a,b)=>b[1]-a[1]).slice(0,8))}</div>
      <div class="box"><h3>الطلبات حسب الحالة</h3>${bars(Object.entries(S.STATUS).map(([k,v])=>[v[0],ORD.filter(o=>o.status===k).length]).filter(r=>r[1]))}</div>
      <div class="box"><h3>أكواد الخصم المستخدمة</h3>${bars(cpn)}</div>
      <div class="box"><h3>العملاء المتكررين</h3>${(()=>{const m={}; ORD.forEach(o=>{m[o.phone]=m[o.phone]||[o.customer_name,0]; m[o.phone][1]++;}); const all=Object.values(m), rep=all.filter(x=>x[1]>1);

    ${o.coupon?`<div class="alert" style="background:#E3F1EA;border-color:#B7DCC8;color:var(--ok)">استخدم كود الخصم <b dir="ltr">${esc(o.coupon)}</b> (${o.discount_pct}%)${o.est_total?`: ${o.est_total} ← ${Math.round(o.est_total*(100-o.discount_pct)/100)} ر.س`:''}</div>`:''}
    <div class="kv"><span>العميل</span><b>${esc(o.customer_name)}</b><span>الجوال</span><b dir="ltr" style="text-align:start">+${esc(o.phone)}</b>${o.email?`<span>الإيميل</span><b dir="ltr" style="text-align:start">${esc(o.email)}</b>`:''}
      ${o.field?`<span>التخصص</span><b>${esc(o.field)}</b>`:''}<span>اللغة</span><b>${({ar:'عربي',en:'إنجليزي',both:'الاثنين'})[o.language]||'—'}</b><span>الموعد</span><b>${o.deadline||'—'}</b>${o.source?`<span>المصدر</span><b>${esc(o.source)}</b>`:''}<span>وقت الطلب</span><b>${dt(o.created_at)}</b></div>
    ${(()=>{const h=ORD.filter(x=>x.phone===o.phone&&x.id!==o.id); return h.length?`<div class="sect">طلباته الثانية (${h.length}) <span class="rep">عميل متكرر</span></div><div class="hist">${h.map(x=>`<a data-oid="${x.id}"><span>${esc(x.service_name)}</span><span>${pill(x.status)} ${d(x.created_at)}</span></a>`).join('')}</div>`:'';})()}
    <div class="sect">التفاصيل</div><div class="det">${esc(o.details)}</div>
    ${o.files&&o.files.length?`<div class="sect">الملفات</div><div class="flist" id="fl">جاري التحميل…</div>`:''}
    <div class="sect">وين وصل الطلب</div>
    <div class="steps">${S.STATUS_FLOW.map((k,i)=>`<span class="${i<=S.STATUS_FLOW.indexOf(o.status)?'on':''}" title="${S.STATUS[k][0]}"></span>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${(()=>{const i=S.STATUS_FLOW.indexOf(o.status), nx=S.STATUS_FLOW[i+1]; return nx&&o.status!=='cancelled'?`<button class="btn btn-primary btn-sm" id="nx" data-nx="${nx}">انقله لـ «${S.STATUS[nx][0]}»</button>`:'';})()}
      <button class="btn btn-ghost btn-sm" id="cpTrack">نسخ رابط التتبع</button><a class="btn btn-ghost btn-sm" href="${track}" target="_blank" rel="noopener">شوف وش يشوف العميل</a></div>
    <small style="color:var(--muted);display:block;margin-top:6px">العميل يشوف الحالة في صفحة التتبع برقم الطلب وآخر 4 أرقام من جواله (${esc(String(o.phone||'').slice(-4))}).</small>
    <div class="sect">إدارة الطلب</div>
    <div class="field"><label>الحالة</label><select class="inp" id="st">${Object.entries(S.STATUS).map(([k,v])=>`<option value="${k}"${k===o.status?' selected':''}>${v[0]}</option>`).join('')}</select></div>
    <div class="row2"><div class="field"><label>السعر (ر.س)</label><input class="inp" id="pr" type="number" min="0" value="${o.price??''}"></div><div class="field"><label>المدفوع (ر.س)</label><input class="inp" id="pd" type="number" min="0" value="${o.paid??0}"></div></div>
    <div class="wa-row" style="margin:-4px 0 12px"><button type="button" class="btn btn-ghost btn-sm" id="payHalf">دفع العربون (النص)</button><button type="button" class="btn btn-ghost btn-sm" id="payFull">دفع كامل</button>${o.price?`<small style="color:var(--muted);align-self:center">${Math.max(0,(+o.price)-(+o.paid||0))} ر.س باقي</small>`:''}</div>
    <div class="field"><label>موعد التسليم</label><input class="inp" id="dl" type="date" value="${o.deadline||''}"></div>
    <div class="field"><label>ملاحظة للعميل <small>(تطلع له في صفحة التتبع)</small></label><textarea class="inp" id="cn" maxlength="500" style="min-height:70px" placeholder="مثل: المعاينة جاهزة، شيّك واتساب">${esc(o.customer_note||'')}</textarea></div>
    <details style="margin-bottom:12px"><summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0">تعديل بيانات العميل</summary>
      <div class="row2" style="margin-top:8px"><div class="field"><label>الاسم</label><input class="inp" id="eName" maxlength="80" value="${esc(o.customer_name||'')}"></div><div class="field"><label>الجوال</label><input class="inp" id="ePhone" dir="ltr" value="${esc(o.phone||'')}"></div></div>
      <div class="field"><label>الإيميل</label><input class="inp" id="eMail" dir="ltr" value="${esc(o.email||'')}"></div></details>
    <div class="field"><label>ملاحظات داخلية <small>(لك بس)</small></label><textarea class="inp" id="nt" style="min-height:90px">${esc(o.admin_notes||'')}</textarea></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary" id="sv">حفظ</button><button class="btn btn-ghost" id="del" style="color:var(--err);margin-inline-start:auto">حذف الطلب</button></div>
    <div class="sect">ملفات للعميل <small style="font-family:var(--f-body);font-weight:400;color:var(--muted)">(ينزلها من صفحة التتبع)</small></div>
    <div class="flist" id="dlv">${(o.delivery||[]).map((f,i)=>`<div class="dl"><a href="${pubUrl(f.path)}" target="_blank" rel="noopener">${esc(f.name)}</a><button data-rmd="${i}" title="حذف">×</button></div>`).join('')||'<small style="color:var(--muted)">ما رفعت ملفات للحين</small>'}</div>
    <label class="btn btn-ghost btn-sm" style="cursor:pointer">رفع ملف للعميل<input type="file" id="up" multiple hidden></label>
    <div class="sect">رسائل واتساب جاهزة</div>
    <div class="wa-row"><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" data-m="quote">إرسال السعر</a><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" data-m="track">رابط التتبع</a><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" data-m="paid">تأكيد الدفع</a><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" data-m="review">المعاينة جاهزة</a><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" data-m="done">تم التسليم + طلب تقييم</a>${o.status==='delivered'&&!reviewed(o.code)?'<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" data-m="remind">تذكير بالتقييم</a>':''}</div>
    ${o.status==='delivered'?`<small style="display:block;margin-top:6px;color:${reviewed(o.code)?'var(--ok)':'var(--muted)'}">${reviewed(o.code)?'✓ العميل قيّم':'العميل ما قيّم للحين'}</small>`:''}
    <small style="color:var(--muted);display:block;margin-top:8px">احفظ السعر أول عشان يطلع في رسالة السعر</small>
  </div></div>`;
  const dw=document.getElementById('dw'), close=()=>{document.getElementById('dr').innerHTML='';};
  document.getElementById('cx').onclick=close; dw.onclick=e=>{if(e.target===dw)close();};
  dw.querySelectorAll('[data-m]').forEach(a=>{a.href=waTo(T[a.dataset.m]);});
  dw.querySelectorAll('[data-oid]').forEach(a=>a.onclick=()=>openOrder(a.dataset.oid));
  const saveDlv=async list=>{ const {error}=await sb.from('orders').update({delivery:list}).eq('id',o.id); if(error){toast('ما انحفظ: '+error.message);return false;} o.delivery=list; return true; };
  document.getElementById('up').onchange=async e=>{ const fs=[...e.target.files]; if(!fs.length) return; const list=[...(o.delivery||[])];
    for(const [i,f] of fs.entries()){ toast(`رفع ${i+1}/${fs.length}…`); const safe=f.name.normalize('NFKD').replace(/[^\w.\-]+/g,'_').slice(-80)||'file', path=`${crypto.randomUUID()}/${safe}`;
      const {error}=await sb.storage.from('deliveries').upload(path,f,{contentType:f.type||'application/octet-stream'}); if(error){toast('ما انرفع: '+error.message); return;} list.push({name:f.name,path}); }
    if(await saveDlv(list)){ toast('انرفعت، العميل يشوفها في التتبع'); openOrder(o.id); } };
  dw.querySelectorAll('[data-rmd]').forEach(b=>b.onclick=async()=>{ const f=o.delivery[+b.dataset.rmd]; if(!confirm(`حذف «${f.name}»؟ العميل ما بيقدر ينزله بعدها.`)) return;
    await sb.storage.from('deliveries').remove([f.path]); if(await saveDlv(o.delivery.filter((_,i)=>i!==+b.dataset.rmd))){ toast('انحذف'); openOrder(o.id);} });
  const setPaid=v=>{ document.getElementById('pd').value=v; const st=document.getElementById('st'); if(['new','quoted'].includes(st.value)) st.value='paid'; toast('اضغط «حفظ» عشان ينحفظ'); };
  document.getElementById('payHalf').onclick=()=>{ const p=+document.getElementById('pr').value; if(!p) return toast('اكتب السعر أول'); setPaid(Math.ceil(p/2)); };
  document.getElementById('payFull').onclick=()=>{ const p=+document.getElementById('pr').value; if(!p) return toast('اكتب السعر أول'); setPaid(p); };
  document.getElementById('cpTrack').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(track).then(()=>toast('انسخ رابط التتبع'));};
  const nxb=document.getElementById('nx'); if(nxb) nxb.onclick=async()=>{nxb.disabled=true; const patch={status:nxb.dataset.nx}; if(patch.status==='delivered') patch.delivered_at=new Date().toISOString();
    const {error}=await sb.from('orders').update(patch).eq('id',o.id); if(error){nxb.disabled=false; return toast(error.message);} Object.assign(o,patch); stats(); render(); toast(`صار «${S.STATUS[patch.status][0]}»، أرسل للعميل رسالته من تحت`); openOrder(o.id);};
  document.getElementById('sv').onclick=async()=>{const b=document.getElementById('sv');b.disabled=true;
    const patch={status:document.getElementById('st').value,price:document.getElementById('pr').value===''?null:+document.getElementById('pr').value,paid:+document.getElementById('pd').value||0,deadline:document.getElementById('dl').value||null,admin_notes:document.getElementById('nt').value||null,customer_note:document.getElementById('cn').value.trim()||null,
      customer_name:document.getElementById('eName').value.trim()||o.customer_name,phone:normPhone(document.getElementById('ePhone').value)||o.phone,email:document.getElementById('eMail').value.trim()||null};
    if(!/^\d{9,15}$/.test(patch.phone)){b.disabled=false; return toast('رقم الجوال غير صحيح');}
    if(patch.status==='delivered'&&o.status!=='delivered') patch.delivered_at=new Date().toISOString();
    const {error}=await sb.from('orders').update(patch).eq('id',o.id); b.disabled=false;
    if(error) return toast('ما انحفظ: '+error.message); Object.assign(o,patch); stats(); render(); toast('تم الحفظ'); openOrder(o.id);};
  document.getElementById('del').onclick=async()=>{ if(!confirm(`حذف الطلب ${o.code} نهائيًا؟ ما تقدر ترجعه.`)) return;
    const {error}=await sb.from('orders').delete().eq('id',o.id); if(error) return toast(error.message); ORD=ORD.filter(x=>x.id!==o.id); close(); stats(); render(); toast('تم الحذف');};
  if(o.files&&o.files.length){ const {data,error}=await sb.storage.from('order-files').createSignedUrls(o.files,3600); const fl=document.getElementById('fl');
    if(fl) fl.innerHTML=error?esc(error.message):(data||[]).map(f=>f.signedUrl?`<a href="${f.signedUrl}" target="_blank" rel="noopener">${esc(f.path.split('/').pop())}</a>`:`<span>${esc(f.path)}</span>`).join(''); }
}
function renderReviews(){
  document.getElementById('body').innerHTML=REV.length?`<div class="rv-grid">${REV.map(r=>`<div class="rv-card"><div style="display:flex;justify-content:space-between"><b>${esc(r.name)}</b><span style="color:var(--gold)">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><small style="color:var(--muted)">${esc(r.service_name||'')} · ${d(r.created_at)} ${r.order_code?`· <code dir="ltr">${esc(r.order_code)}</code>`:''}</small><p style="margin:0">${esc(r.body)}</p>
    <div style="display:flex;gap:8px">${!r.approved?`<span class="pill" style="background:#6b7280">مخفي</span>`:''}${r.approved?`<span class="pill" style="background:var(--ok)">ظاهر في الموقع</span><button class="btn btn-ghost btn-sm" data-h="${r.id}">إخفاء</button>`:`<button class="btn btn-primary btn-sm" data-a="${r.id}">إظهار في الموقع</button>`}<button class="btn btn-ghost btn-sm" data-x="${r.id}" style="color:var(--err)">حذف</button></div></div>`).join('')}</div>`:`<div class="empty">ما فيه تقييمات للحين. لما تسلّم طلب أرسل للعميل رسالة «تم التسليم + طلب تقييم» من صفحة الطلب. تقييم العميل يظهر في الموقع على طول، وتقدر تخفي أي تقييم من هنا.</div>`;
  document.getElementById('body').onclick=async e=>{const a=e.target.closest('[data-a],[data-h],[data-x]'); if(!a) return; const id=a.dataset.a||a.dataset.h||a.dataset.x;
    if(a.dataset.x){ if(!confirm('حذف التقييم؟')) return; await sb.from('reviews').delete().eq('id',id); REV=REV.filter(r=>r.id!==id); }
    else { const ap=!!a.dataset.a; await sb.from('reviews').update({approved:ap}).eq('id',id); REV.find(r=>r.id===id).approved=ap; }
    stats(); renderReviews(); };
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') loginView(); });
boot();
})();
</script>
</body>
</html>
